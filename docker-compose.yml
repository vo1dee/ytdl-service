services:
  ytdl-service:
    build: .
    container_name: ytdl-service
    user: "${PUID:-1001}:${PGID:-1001}"
    ports:
      - "${EXTERNAL_PORT:-8000}:${PORT:-8000}"
    volumes:
      - ${DOWNLOADS_HOST_PATH:-./downloads}:/opt/ytdl_service/downloads:rw
      - ${LOGS_HOST_PATH:-./logs}:/opt/ytdl_service/logs:rw
      - ${CONFIG_HOST_PATH:-./config}:/opt/ytdl_service/config:rw
    environment:
      - YTDL_SERVICE_URL=${YTDL_SERVICE_URL:-http://localhost:8000}
      - PORT=${PORT:-8000}
      - YTDLP_UPDATE_INTERVAL=${YTDLP_UPDATE_INTERVAL:-31536000}
      - YTDLP_DISABLE_UPDATE=${YTDLP_DISABLE_UPDATE:-true}
      - YTDL_MAX_RETRIES=${YTDL_MAX_RETRIES:-3}
      - YTDL_RETRY_DELAY=${YTDL_RETRY_DELAY:-1}
      - DOWNLOADS_DIR=${DOWNLOADS_DIR:-/opt/ytdl_service/downloads}
      - LOGS_DIR=${LOGS_DIR:-/opt/ytdl_service/logs}
      - API_KEY_FILE=${API_KEY_FILE:-/opt/ytdl_service/config/api_key.txt}
      - YTDL_SERVICE_API_KEY=${YTDL_SERVICE_API_KEY}
      - SECURITY_HARDENING=${SECURITY_HARDENING:-false}
      - PUID=${PUID:-1001}
      - PGID=${PGID:-1001}
      - UMASK=${UMASK:-0002}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/ytdl_service/health_check.sh", "--quick"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    networks:
      - ytdl-network

networks:
  ytdl-network:
    driver: bridge